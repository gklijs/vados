<a class="notification {{ color }}{{ placement.to_css_classes() }}" href="{{ url }}" target="_blank" id="{{ id }}">
    {% if let Some(t) = title %}
    <h2 class="title">{{ t }}</h2>
    {% endif %}
    {% if let Some(i) = image %}
    {{ i|safe }}
    {% endif %}
    <div class="content is-medium mgb-small">
        {{ content|safe }}
    </div>
</a>
