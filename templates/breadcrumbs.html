<nav aria-label="{{ ui.breadcrumbs }}" class="breadcrumb is-hidden-touch">
    <ul>
        {% for crumb in crumbs %}
        <li>
            <a href="{{ crumb.url }}">
                {% if let Some(icon) = crumb.icon %}{{ crate::icons::icon_span(icon, 24, "icon m-0")|safe }}{% endif %}
                {{ crumb.title }}
            </a>
        </li>
        {% endfor %}
        <li class="is-active">
            <a aria-current="page" href="#">
                {% if let Some(icon) = last.icon %}{{ crate::icons::icon_span(icon, 24, "icon m-0")|safe }}{% endif %}
                {{ last.title }}
            </a>
        </li>
    </ul>
</nav>
