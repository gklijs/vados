<nav aria-label="{{ ui.breadcrumbs }}" class="breadcrumb is-hidden-touch">
    <ul>
        {% for crumb in crumbs %}
        <li>
            <a href="{{ crumb.url }}">
                {% if let Some(icon) = crumb.icon %}
                <span class="icon m-0">{{ crate::icons::icon_svg(icon, 24)|safe }}</span>
                {% endif %}
                {{ crumb.title }}
            </a>
        </li>
        {% endfor %}
        <li class="is-active">
            <a aria-current="page" href="#">
                {% if let Some(icon) = last.icon %}
                <span class="icon m-0">{{ crate::icons::icon_svg(icon, 24)|safe }}</span>
                {% endif %}
                {{ last.title }}
            </a>
        </li>
    </ul>
</nav>
