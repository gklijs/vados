{% for e in events %}
<section class="tile is-child box p-2" aria-labelledby="luma-event-{{ loop.index }}">
    <p class="title is-4" id="luma-event-{{ loop.index }}">
        <a href="{{ e.event_url }}">{{ e.title }}</a>
    </p>
    {% if e.shows_event_page %}
    <iframe src="{{ e.embed_url }}" title="{{ e.title }}" loading="lazy" width="100%" height="450"
            style="border: 1px solid #bfcbda88; border-radius: 4px;" allow="fullscreen; payment"></iframe>
    {% endif %}
    {% if e.shows_register_button %}
    <a href="{{ e.event_url }}" class="button is-primary luma-checkout--button" data-luma-action="checkout"
       data-luma-event-id="{{ e.event_id }}">{{ e.button_label }}</a>
    {% endif %}
</section>
{% endfor %}
