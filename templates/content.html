<div class="box p-2" id="main-content-box">
    <h1 class="title is-1">{{ title }}</h1>
    {% if let Some(s) = sub_title %}
    <p class="subtitle is-3">{{ s }}</p>
    {% endif %}
    {% if let Some(d) = date %}
    <p class="is-size-5 mb-4"><time datetime="{{ d.iso }}">{{ d.text }}</time></p>
    {% endif %}
    {% if let Some(i) = image %}
    {{ i|safe }}
    {% endif %}
    <div class="content is-medium mgb-small">
        {{ content|safe }}
    </div>
    {% if let Some(f) = feed %}
    <p class="mt-4">
        <a href="{{ f.href }}" type="application/atom+xml">
            <span class="icon"><i class="mdi mdi-rss" aria-hidden="true"></i></span>
            <span>{{ ui.subscribe_feed }}</span>
        </a>
    </p>
    {% endif %}
</div>
