<div class="cell {{ start_class }} is-row-span-{{ rows }}-tablet is-hidden-mobile" id="spare-tile">
    <div class="box">
        {% if let Some(t) = title %}
        <h2 class="title is-5">{{ t }}</h2>
        {% endif %}
        <ul>
            {% for l in links %}
            <li><a href="{{ l.url }}">{{ l.title }}</a></li>
            {% endfor %}
        </ul>
    </div>
</div>
