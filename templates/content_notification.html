<div class="notification tile is-child {{ color }}" id="{{ id }}"{% if let Some(o) = order %} style="order: {{ o }};"{% endif %}>
    {% if let Some(t) = title %}
    <h2 class="title">{{ t }}</h2>
    {% endif %}
    {% if let Some(i) = image %}
    {{ i|safe }}
    {% endif %}
    <div class="content is-medium mgb-small">
        {{ content|safe }}
    </div>
</div>
