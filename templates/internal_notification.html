<a class="notification {{ color }}{{ placement.to_css_classes() }}" href="{{ url }}" target="_self" id="{{ id }}">
    {% if let Some(t) = title %}
    <h2 class="title">{{ t }}</h2>
    {% endif %}
    {% if let Some(s) = sub_title %}
    <p class="subtitle">{{ s }}</p>
    {% endif %}
    {% if let Some(d) = date %}
    <p class="mb-2"><time datetime="{{ d.iso }}">{{ d.text }}</time></p>
    {% endif %}
    {% if let Some(i) = image %}
    {{ i|safe }}
    {% endif %}
    {% if let Some(c) = content %}
    <div class="content is-medium mgb-small">
        {{ c|safe }}
    </div>
    {% endif %}
</a>
