# `cargo deny check advisories licenses`, run by .github/workflows/audit.yml.
# Only these two sections are checked; cargo-deny's defaults apply elsewhere.

[advisories]
# Unmaintained crates we can't replace ourselves. Remove an entry once the crate
# that pulls it in has moved on, or when replacing that crate becomes worthwhile.
ignore = [
    # basic-toml reads askama's optional config file at compile time; vados has
    # none. Waiting on askama.
    { id = "RUSTSEC-2026-0374", reason = "askama's compile-time dependency; waiting on askama" },
    # bincode loads syntect's bundled syntax definitions and themes; it never
    # sees site input. Waiting on syntect.
    { id = "RUSTSEC-2025-0141", reason = "syntect's dependency for its bundled dumps; waiting on syntect" },
]

[licenses]
# vados is MIT and its release binaries bundle every dependency, so only
# permissive licences, and MPL-2.0 (file-level copyleft, met by the published
# crate sources), are allowed. A crate offering several licences needs just one
# of these. Data shipped inside crates (the time zone database, syntect's syntax
# definitions) is covered by that crate's licence; the icons in `assets/mdi`
# aren't a crate and carry their own LICENSE there.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
