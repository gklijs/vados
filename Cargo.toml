[package]
name = "vados"
version = "0.5.0"
authors = ["Gerard Klijs <g.klijs@gmail.com>"]
include = ["src/**/*", "templates/**/*", "assets/**/*", "Cargo.toml", "/README.md", "/CHANGELOG.md", "/LICENSE-MIT"]
description = "A Html generator, used with Bulma and a certain file structure to generate a static site"
repository = "https://github.com/gklijs/vados"
readme = "README.md"
keywords = ["html", "static", "generator"]
categories = ["filesystem", "web-programming"]
license = "MIT"
edition = "2021"
rust-version = "1.88.0"

[dependencies]
askama = "0.16.0"
clap = { version = "4.1.4", features = ["derive"] }
dashmap = "6.2.1"
dialoguer = "0.12.0"
fast_image_resize = "6.1.0"
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
minifier = {version = "0.4.0", features = ["html"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["simd", "html"] }
ureq = { version = "3.3", optional = true }
serde = {version = "1.0.135", features = ["derive"]}
serde_json = "1.0.78"
scraper = { version = "0.25.0", default-features = false }
url = "2.5.8"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "html", "regex-fancy"], optional = true }
walkdir = "2.3.2"
webp = "0.3.1"

[dev-dependencies]
# Validates configuration files against the committed JSON Schemas in tests.
jsonschema = { version = "0.60.2", default-features = false }
proptest = "1"
roxmltree = "0.21.1"
# Generates the JSON Schemas in `schemas/` from the configuration structs, in a
# unit test, so the normal binary never depends on it.
schemars = "1.2.3"

[features]
# Colours Markdown code blocks at build time. On by default; without it they stay plain.
default = ["highlight", "external-links"]
highlight = ["dep:syntect"]
# Lets the link check ask other sites about links, with `--external`. Without it
# vados has no way to reach the network at all.
external-links = ["dep:ureq"]

# Release binaries are attached to GitHub releases (see .github/workflows/release.yml);
# `cargo binstall vados` downloads them instead of compiling.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.tar.gz"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[profile.release]
strip = true
