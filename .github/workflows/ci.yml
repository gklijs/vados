name: CI

on: [push, pull_request]

# Each job keeps its own Swatinem/rust-cache entry (dependencies only, keyed on
# the toolchain and Cargo.lock). Only runs on main save it, so feature branches
# and pull requests reuse main's entry instead of filling the cache quota. The
# release workflow builds without a cache on purpose.
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --verbose
      - name: Test
        run: cargo test --verbose
      - name: Clippy without optional features
        run: cargo clippy --all-targets --no-default-features -- -D warnings

  # Keeps `rust-version` in Cargo.toml true; update both together.
  minimum-rust-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check
        run: cargo check --all-targets --locked

  # What only a real browser can see: layout, keyboard use, scripts and colours.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Build
        run: cargo build --verbose
      - name: Install
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
      - name: Test
        working-directory: tests/browser
        run: npm test
